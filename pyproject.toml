[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewaymesh"
version = "0.1.0"
description = "API gateway with load balancing, retries, circuit breaking, rate limiting and health checks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gatewaymesh = "gatewaymesh.cli:main"

[tool.setuptools]
packages = ["gatewaymesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
